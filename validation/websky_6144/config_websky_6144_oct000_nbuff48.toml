# Websky 6144^3 GPU Multi-Resolution — Octant 000 — nbuff=48 (shell-radius fix)
#
# Fixes the nhunt truncation bug: nhunt = min(nbuff-1, 1.75*Rfclmax/alatt).
# With nbuff=16 this clamped the collapse-search radius to 15 cells = 18.8 Mpc/h,
# pinning all large-scale peaks (Rf>~11 Mpc/h) at RTHL≈18.7 → fake 1e15 Msun/h
# halos (26% of catalog) + over-exclusion of real halos.
# nbuff=48 makes nhunt filter-limited (47 cells = 58.9 Mpc/h), so the largest
# halos resolve their true collapse radius.
#
# Killarney Standard Compute (4x L40S 48 GB)
# Observer at centered coord (-3850.0, -3850.0, -3850.0) Mpc/h (box corner).
#
# Geometry: nbuff=24 is the MAX the GPU shell kernel allows. The kernel stores
# per-peak shell profiles in dynamic shared memory sized to _MAX_SHELLS_GPU=512
# (CUDAExt.jl:1263); nhunt=23 cells gives 443 distinct shells (<512). nbuff=48
# (nhunt=47, 1843 shells) overflowed shared mem -> ILLEGAL_ADDRESS crash.
#   ntile=16, nmesh=429, nbuff=24
#   nsub = 429 - 48 = 381
#   N = 381*16 + 48 = 6144
#   cellsize = 7700/6144 = 1.25326 Mpc/h
#   per-tile boxsize = 429 * 1.25326 = 537.6465 Mpc/h
#   coarse grid M = ntile*coarse_factor = 16*4 = 64 (N/M = 96, integer) OK
#   nhunt = min(nbuff-1=23, 47) = 23 cells = 28.82 Mpc/h  (was 15 cells = 18.8 Mpc/h)
# PARTIAL fix: resolves filters up to Rf~16 Mpc/h; the top ~5 filters (Rf 19-34)
# still truncate at 28.8 Mpc/h. A FULL fix needs raising _MAX_SHELLS_GPU + adding
# a >48KB dynamic-shared-memory opt-in in the kernel (untested kernel change).

[cosmology]
Om   = 0.31
OB   = 0.049
OL   = 0.69
h    = 0.68

[grid]
n       = 429
boxsize = 537.6465
nbuff   = 24
cenx    = -3850.0
ceny    = -3850.0
cenz    = -3850.0

[run]
z_out     = 0.0
z_max     = 4.6
ievol     = 1
ilpt      = 2
ioutshear = 1
wsmooth   = 1
rmax2rs   = 0.0
NonGauss  = 0
fNL       = 0.0
seed      = 12345
ntile     = 16
coarse_factor = 4
generate_table = true

[files]
pk         = "validation/websky_6144/data/pk_websky.dat"
filterbank = "validation/websky_6144/data/filters_websky.dat"
homeltab   = "validation/websky_6144/data/HomelTab_websky.dat"
output     = "catalog_websky_6144_oct000_pkfix.pksc"

[output]
format = "pksc"
path   = "/home/yguan/projects/aip-aspuru-ab/yguan/websky"
